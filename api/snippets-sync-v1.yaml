openapi: 3.1.0
info:
  title: Snippets Sync API
  version: 1.0.0
  description: >-
    Version 1 blind-storage protocol. The service treats blob and every key
    envelope as opaque bytes and never parses the encrypted SyncEnvelope.
servers:
  - url: https://sync.example.invalid
security:
  - bearerAuth: []
paths:
  /.well-known/snippets-sync:
    get:
      operationId: getDiscovery
      security: []
      responses:
        '200':
          description: Immutable server identity and protocol limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discovery' }
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Dependencies are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/spaces:
    get:
      operationId: listSpaces
      parameters: [{ $ref: '#/components/parameters/Authorization' }]
      responses:
        '200':
          description: Spaces visible to the authenticated identity.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [spaces]
                properties:
                  spaces:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/Space' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createSpace
      parameters: [{ $ref: '#/components/parameters/Authorization' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSpaceRequest' }
      responses:
        '201':
          description: Created personal space.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        default: { $ref: '#/components/responses/Error' }
  /v1/spaces/{space}/scope:
    get:
      operationId: getScope
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Space' }
      responses:
        '200':
          description: Current binding and dataset identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scope' }
        default: { $ref: '#/components/responses/Error' }
  /v1/spaces/{space}/changes:
    get:
      operationId: getChanges
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Space' }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 4096 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        '200':
          description: Full snapshot page or ordered delta page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangesPage' }
        default: { $ref: '#/components/responses/Error' }
  /v1/spaces/{space}/records:batch:
    post:
      operationId: submitRecords
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Space' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRequest' }
      responses:
        '200':
          description: One positional outcome for every input record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v1/spaces/{space}/key-envelopes/current:
    get:
      operationId: getCurrentKeyEnvelopes
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Space' }
      responses:
        '200':
          description: Current opaque recovery envelope, if configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyEnvelopeSet' }
        default: { $ref: '#/components/responses/Error' }
  /v1/spaces/{space}/key-envelopes/recovery:
    put:
      operationId: putRecoveryKeyEnvelope
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Space' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutKeyEnvelopeRequest' }
      responses:
        '200':
          description: Stored opaque envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /v1/spaces/{space}/pairings:
    post:
      operationId: createPairing
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Space' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePairingRequest' }
      responses:
        '201':
          description: Short-lived pairing offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pairing' }
        default: { $ref: '#/components/responses/Error' }
  /v1/spaces/{space}/pairings/{pairing}:
    get:
      operationId: getPairing
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Space' }
        - { $ref: '#/components/parameters/Pairing' }
      responses:
        '200':
          description: Pairing state and opaque approved envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pairing' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: consumePairing
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Space' }
        - { $ref: '#/components/parameters/Pairing' }
      responses:
        '204': { description: Pairing consumed or cancelled. }
        default: { $ref: '#/components/responses/Error' }
  /v1/spaces/{space}/pairings/{pairing}/approval:
    put:
      operationId: approvePairing
      parameters:
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/Space' }
        - { $ref: '#/components/parameters/Pairing' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovePairingRequest' }
      responses:
        '200':
          description: Approved pairing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pairing' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 16384 }
    Space:
      name: space
      in: path
      required: true
      schema: { type: string, format: uuid }
    Pairing:
      name: pairing
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Closed protocol error. No arbitrary exception text is returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Dependency is unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Discovery:
      type: object
      additionalProperties: false
      required: [protocolMajor, protocolMinor, serverVersion, serverInstanceId, apiBase, oidc, limits, recordProfile, capabilities]
      properties:
        protocolMajor: { type: integer, const: 1 }
        protocolMinor: { type: integer, minimum: 0 }
        serverVersion: { type: string, maxLength: 64 }
        serverInstanceId: { type: string, format: uuid }
        apiBase: { type: string, format: uri, maxLength: 2048 }
        oidc: { $ref: '#/components/schemas/OIDCDiscovery' }
        limits: { $ref: '#/components/schemas/Limits' }
        recordProfile: { type: string, const: snippets-wire-v1 }
        capabilities:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 64 }
    OIDCDiscovery:
      type: object
      additionalProperties: false
      required: [issuer, clientId, scopes]
      properties:
        issuer: { type: string, format: uri, maxLength: 2048 }
        clientId: { type: string, minLength: 1, maxLength: 256 }
        scopes:
          type: array
          minItems: 1
          maxItems: 16
          items: { type: string, maxLength: 64 }
    Limits:
      type: object
      additionalProperties: false
      required: [maxBlobBytes, maxRevisionBytes, maxBatchRecords, maxPageRecords, maxRequestBytes, maxResponseBytes, maxKeyEnvelopeBytes, maxPairingSeconds]
      properties:
        maxBlobBytes: { type: integer, const: 900000 }
        maxRevisionBytes: { type: integer, const: 256 }
        maxBatchRecords: { type: integer, maximum: 50 }
        maxPageRecords: { type: integer, maximum: 50 }
        maxRequestBytes: { type: integer, maximum: 16777216 }
        maxResponseBytes: { type: integer, maximum: 67108864 }
        maxKeyEnvelopeBytes: { type: integer, maximum: 262144 }
        maxPairingSeconds: { type: integer, maximum: 600 }
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    CreateSpaceRequest:
      type: object
      additionalProperties: false
      properties:
        idempotencyKey: { type: string, format: uuid }
    Space:
      allOf:
        - { $ref: '#/components/schemas/Scope' }
        - type: object
          additionalProperties: false
          required: [role, keyEpoch]
          properties:
            role: { type: string, enum: [owner, writer, reader] }
            keyEpoch: { type: integer, minimum: 1 }
    Scope:
      type: object
      additionalProperties: false
      required: [spaceId, scopeBinding, datasetGeneration, feedEpoch]
      properties:
        spaceId: { type: string, format: uuid }
        scopeBinding: { type: string, minLength: 32, maxLength: 256 }
        datasetGeneration: { type: string, format: uuid }
        feedEpoch: { type: string, format: uuid }
    WireRecord:
      type: object
      additionalProperties: false
      required: [id, rev, deleted, blob]
      properties:
        id: { type: string, format: uuid }
        rev: { type: string, minLength: 1, maxLength: 256 }
        deleted: { type: boolean }
        blob: { type: string, format: byte, maxLength: 1200000 }
    ServerRecord:
      allOf:
        - { $ref: '#/components/schemas/WireRecord' }
        - type: object
          additionalProperties: false
          required: [recordVersion]
          properties:
            recordVersion: { type: string, minLength: 32, maxLength: 2048 }
    ChangesPage:
      allOf:
        - { $ref: '#/components/schemas/Scope' }
        - type: object
          additionalProperties: false
          required: [records, cursor, hasMore, fullSnapshot]
          properties:
            records:
              type: array
              maxItems: 50
              items: { $ref: '#/components/schemas/ServerRecord' }
            cursor: { type: string, minLength: 1, maxLength: 4096 }
            hasMore: { type: boolean }
            fullSnapshot: { type: boolean }
    BatchRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/BatchItem' }
    BatchItem:
      type: object
      additionalProperties: false
      required: [record, expectedRecordVersion]
      properties:
        record: { $ref: '#/components/schemas/WireRecord' }
        expectedRecordVersion:
          type: [string, 'null']
          minLength: 32
          maxLength: 2048
    BatchResponse:
      allOf:
        - { $ref: '#/components/schemas/Scope' }
        - type: object
          additionalProperties: false
          required: [outcomes, partial]
          properties:
            outcomes:
              type: array
              minItems: 1
              maxItems: 50
              items: { $ref: '#/components/schemas/BatchOutcome' }
            partial: { type: boolean }
    BatchOutcome:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [accepted, conflict, rejected] }
        recordVersion: { type: string, minLength: 32, maxLength: 2048 }
        revision: { type: string, minLength: 1, maxLength: 256 }
        authoritativeRecord: { $ref: '#/components/schemas/ServerRecord' }
        errorCode: { $ref: '#/components/schemas/ErrorCode' }
        retryAfterSeconds: { type: integer, minimum: 1, maximum: 86400 }
    KeyEnvelopeSet:
      allOf:
        - { $ref: '#/components/schemas/Scope' }
        - type: object
          additionalProperties: false
          required: [keyEpoch]
          properties:
            keyEpoch: { type: integer, minimum: 1 }
            recovery: { $ref: '#/components/schemas/KeyEnvelope' }
    KeyEnvelope:
      type: object
      additionalProperties: false
      required: [purpose, version, keyEpoch, algorithm, ciphertext, createdAt]
      properties:
        purpose: { type: string, enum: [recovery] }
        version: { type: integer, minimum: 1 }
        keyEpoch: { type: integer, minimum: 1 }
        algorithm: { type: string, minLength: 1, maxLength: 64 }
        ciphertext: { type: string, format: byte, maxLength: 349526 }
        createdAt: { type: string, format: date-time }
    PutKeyEnvelopeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, keyEpoch, algorithm, ciphertext]
      properties:
        expectedVersion: { type: [integer, 'null'], minimum: 1 }
        keyEpoch: { type: integer, minimum: 1 }
        algorithm: { type: string, minLength: 1, maxLength: 64 }
        ciphertext: { type: string, format: byte, maxLength: 349526 }
    CreatePairingRequest:
      type: object
      additionalProperties: false
      required: [recipientPublicKey, authenticationTag, expiresInSeconds]
      properties:
        recipientPublicKey: { type: string, format: byte, maxLength: 512 }
        authenticationTag: { type: string, pattern: '^[A-Z2-9]{6,12}$' }
        expiresInSeconds: { type: integer, minimum: 60, maximum: 600 }
    ApprovePairingRequest:
      type: object
      additionalProperties: false
      required: [recipientKeyHash, algorithm, ciphertext]
      properties:
        recipientKeyHash: { type: string, format: byte, minLength: 43, maxLength: 44 }
        algorithm: { type: string, minLength: 1, maxLength: 64 }
        ciphertext: { type: string, format: byte, maxLength: 349526 }
    Pairing:
      type: object
      additionalProperties: false
      required: [pairingId, spaceId, recipientPublicKey, authenticationTag, state, expiresAt]
      properties:
        pairingId: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        recipientPublicKey: { type: string, format: byte, maxLength: 512 }
        authenticationTag: { type: string, pattern: '^[A-Z2-9]{6,12}$' }
        state: { type: string, enum: [pending, approved] }
        algorithm: { type: string, minLength: 1, maxLength: 64 }
        ciphertext: { type: string, format: byte, maxLength: 349526 }
        expiresAt: { type: string, format: date-time }
    Error:
      type: object
      additionalProperties: false
      required: [code, requestId]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        requestId: { type: string, format: uuid }
        retryAfterSeconds: { type: integer, minimum: 1, maximum: 86400 }
        limit: { type: integer, minimum: 0 }
    ErrorCode:
      type: string
      enum: [invalid_request, authentication_required, forbidden, not_found, conflict, cursor_invalid, dataset_reset, incompatible_version, payload_too_large, quota_exceeded, rate_limited, pairing_expired, dependency_unavailable, internal_error]
