project:
  name: Snippets iPhone App Store RU
  output_dir: ../marketing/ru/iphone-6.9
  device: iPhone 17 Pro Max - Deep Blue - Portrait
  output_size: iPhone6_9

defaults:
  background:
    type: linear
    colors:
      - "#171A3B"
      - "#40359B"
      - "#7167E8"
    direction: 165

screenshots:
  01_library:
    content:
      - type: text
        content: "Важный текст всегда под рукой"
        position: ["50%", "12%"]
        size: 72
        color: "#FFFFFF"
        weight: bold
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Display-Semibold.otf
      - type: text
        content: "Находите и копируйте за секунду."
        position: ["50%", "20%"]
        size: 36
        color: "#DDD9FF"
        weight: normal
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Text-Regular.otf
      - type: image
        asset: ../en-US/iphone-6.9/01-library.png
        position: ["50%", "63%"]
        scale: 0.64
        frame: true

  02_editor:
    content:
      - type: text
        content: "Создайте раз. Используйте всегда."
        position: ["50%", "12%"]
        size: 68
        color: "#FFFFFF"
        weight: bold
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Display-Semibold.otf
      - type: text
        content: "Сообщения, шаблоны, код и многое другое."
        position: ["50%", "20%"]
        size: 34
        color: "#DDD9FF"
        weight: normal
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Text-Regular.otf
      - type: image
        asset: ../en-US/iphone-6.9/02-editor.png
        position: ["50%", "63%"]
        scale: 0.64
        frame: true

  03_secure:
    content:
      - type: text
        content: "Приватность, когда она важна"
        position: ["50%", "12%"]
        size: 72
        color: "#FFFFFF"
        weight: bold
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Display-Semibold.otf
      - type: text
        content: "Защищайте важный текст с Face ID."
        position: ["50%", "20%"]
        size: 36
        color: "#DDD9FF"
        weight: normal
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Text-Regular.otf
      - type: image
        asset: ../en-US/iphone-6.9/03-secure.png
        position: ["50%", "63%"]
        scale: 0.64
        frame: true
