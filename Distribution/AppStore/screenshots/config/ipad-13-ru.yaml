project:
  name: Snippets iPad App Store RU
  output_dir: ../marketing/ru/ipad-13
  device: iPad Pro 13 - M4 - Space Gray - Portrait
  output_size: iPadPro13

defaults:
  background:
    type: linear
    colors:
      - "#171A3B"
      - "#40359B"
      - "#7167E8"
    direction: 165

screenshots:
  01_workspace:
    content:
      - type: text
        content: "Полноценная работа на iPad"
        position: ["50%", "12%"]
        size: 100
        color: "#FFFFFF"
        weight: bold
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Display-Semibold.otf
      - type: text
        content: "Библиотека и редактор рядом."
        position: ["50%", "20%"]
        size: 48
        color: "#DDD9FF"
        weight: normal
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Text-Regular.otf
      - type: image
        asset: ../en-US/ipad-13/01-library-and-editor.png
        position: ["50%", "62%"]
        scale: 0.64
        frame: true

  02_placeholders:
    content:
      - type: text
        content: "Шаблоны обновляются сами"
        position: ["50%", "12%"]
        size: 100
        color: "#FFFFFF"
        weight: bold
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Display-Semibold.otf
      - type: text
        content: "Сразу проверяйте даты и подстановки."
        position: ["50%", "20%"]
        size: 48
        color: "#DDD9FF"
        weight: normal
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Text-Regular.otf
      - type: image
        asset: ../en-US/ipad-13/02-placeholder-preview.png
        position: ["50%", "62%"]
        scale: 0.64
        frame: true

  03_shortcuts:
    content:
      - type: text
        content: "Всё управление — с клавиатуры"
        position: ["50%", "12%"]
        size: 100
        color: "#FFFFFF"
        weight: bold
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Display-Semibold.otf
      - type: text
        content: "Быстрые команды для частых действий."
        position: ["50%", "20%"]
        size: 48
        color: "#DDD9FF"
        weight: normal
        alignment: center
        font_family: /Library/Fonts/SF-Pro-Text-Regular.otf
      - type: image
        asset: ../en-US/ipad-13/03-keyboard-shortcuts.png
        position: ["50%", "62%"]
        scale: 0.64
        frame: true
